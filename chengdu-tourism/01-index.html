<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成都·天府之国 - 封面页</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts：Montserrat + Noto Sans SC -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Noto+Sans:zh-CN,wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* 自定义样式 */
    body { font-family: 'Noto Sans', sans-serif; }
    .font-display { font-family: 'Montserrat', sans-serif; }
    /* 封面页特殊背景样式 */
    .cover-bg {
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1540966551083-83e6c7e5b8a5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .animate-in {
      animation: fadeIn 1s ease-out forwards;
      opacity: 0;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>
<body class="bg-white">

  <!-- 顶部导航栏 -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="01-index.html" class="text-xl font-display font-bold text-gray-900">成都·天府之国</a>
      <div class="flex gap-2">
        <a href="01-index.html" class="text-gray-500 hover:text-blue-600 transition">首页</a>
        <a href="02-panda-overview.html" class="text-gray-500 hover:text-blue-600 transition">下一页</a>
      </div>
    </div>
  </nav>

  <!-- 主容器 -->
  <main class="relative pt-24 max-w-7xl mx-auto px-4 pb-24">

    <!-- 背景覆盖层 -->
    <div class="cover-bg min-h-screen"></div>

    <!-- 页面标题区域 -->
    <div class="relative z-10 animate-in">
      <div class="max-w-2xl mx-auto text-center py-20">
        <h1 class="font-display text-5xl md:text-6xl font-bold text-white mb-4">成都·天府之国</h1>
        <p class="text-lg text-white/80 mb-6">探索天府之国的魅力，感受历史与现代的交融</p>
        <div class="inline-block px-4 py-2 bg-white/20 rounded-full text-sm">
          <span class="text-white">成都旅游精华介绍</span>
        </div>
      </div>
    </div>

    <!-- 统一导航区域 -->
    <div class="mt-32 flex justify-center gap-4 animate-in" style="animation-delay: 0.3s;">
      <a href="01-index.html" class="inline-block px-5 py-2 bg-white/20 text-white rounded hover:bg-white/30 transition text-sm font-medium">首页</a>
      <a href="02-panda-overview.html" class="inline-block px-5 py-2 bg-white/20 text-white rounded hover:bg-white/30 transition text-sm font-medium">下一页</a>
    </div>

  </main>

  <!-- 底部版权 -->
  <footer class="fixed bottom-0 left-0 right-0 py-6 text-center text-xs text-gray-500">
    <p>成都旅游景点介绍 | 课程作业设计 | 2026</p>
  </footer>

</body>
</html>
